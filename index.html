  // Each trigger is assigned exactly one Embed Post URL.
  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function getShuffledIndices() {
    const ORDER_KEY = "vaultEmbedPostOrderV1";
    try {
      const saved = localStorage.getItem(ORDER_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length === 11 &&
            parsed.every(n => Number.isInteger(n) && n >= 0 && n < 11) &&
            new Set(parsed).size === 11) return parsed;
      }
    } catch (e) {}
    const indices = Array.from({ length: 11 }, (_, i) => i);
    shuffleArray(indices);
    localStorage.setItem(ORDER_KEY, JSON.stringify(indices));
    return indices;
  }

  const shuffledOrder = getShuffledIndices();
  const TOTAL_POSTS = 11;
  const TOTAL_TRIGGERS = 11;
  let clickCounts = new Array(TOTAL_POSTS).fill(0);
  const STORAGE_KEY = "vaultEmbedPostViewsV1";

  function loadCounts() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const arr = JSON.parse(saved);
        if (Array.isArray(arr) && arr.length === TOTAL_POSTS && arr.every(n => Number.isFinite(n) && n >= 0)) {
          clickCounts = arr;
        }
      }
    } catch (e) {}
  }
  function saveCounts() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(clickCounts));
  }
  function updateTotalDisplay() {
    const total = clickCounts.reduce((a,b)=>a+b,0);
    document.getElementById("totalClicks").innerText = total;
  }

  let currentTier = 1;

  function getPostUrl(rawUrl) {
    // Facebook post plugin URLs are converted to the SDK's responsive post embed.
    // Other supplied embed URLs are loaded directly in a responsive iframe.
    try {
      const parsed = new URL(rawUrl);
      const href = parsed.searchParams.get("href");
      if (parsed.hostname.includes("facebook.com") && parsed.pathname.includes("/plugins/post.php") && href) {
        return { type: "facebook", url: href };
      }
      if (parsed.hostname.includes("facebook.com") && !parsed.pathname.includes("/plugins/")) {
        return { type: "facebook", url: rawUrl };
      }
    } catch (e) {}
    return { type: "iframe", url: rawUrl };
  }

  function renderCurrentTier() {
    const container = document.getElementById("embedContent");
    const globalIdx = shuffledOrder[currentTier - 1];
    const postUrl = ALL_LINKS[globalIdx];
    if (!postUrl) return;

    const tierNames = ["Starter", "Bronze", "Silver", "Gold", "Platinum", "Emerald", "Ruby", "Sapphire", "Diamond", "Ultimate"];
    document.getElementById("levelName").innerText = `Trigger ${currentTier} · ${tierNames[currentTier-1] || "Post"}`;
    document.getElementById("levelBadge").innerText = "1 Embed Post";

    container.innerHTML = '<div class="embed-loading">Loading embedded post…</div>';
    const embed = getPostUrl(postUrl);

    if (embed.type === "facebook") {
      const blockquote = document.createElement("blockquote");
      blockquote.className = "fb-post";
      blockquote.setAttribute("data-href", embed.url);
      blockquote.setAttribute("data-show-text", "true");
      blockquote.setAttribute("data-width", "");
      blockquote.style.width = "100%";
      container.innerHTML = "";
      container.appendChild(blockquote);

      if (window.FB && window.FB.XFBML) {
        window.FB.XFBML.parse(container);
      } else {
        if (!document.getElementById("facebook-jssdk")) {
          const script = document.createElement("script");
          script.id = "facebook-jssdk";
          script.src = "https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v20.0";
          script.async = true;
          script.onload = () => { if (window.FB && window.FB.XFBML) window.FB.XFBML.parse(container); };
          document.body.appendChild(script);
        }
      }
    } else {
      const frame = document.createElement("iframe");
      frame.src = embed.url;
      frame.title = `Embedded Post ${currentTier}`;
      frame.loading = "eager";
      frame.scrolling = "auto";
      frame.referrerPolicy = "strict-origin-when-cross-origin";
      frame.allow = "autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share";
      frame.setAttribute("allowfullscreen", "true");
      frame.height = "1100";
      container.innerHTML = "";
      container.appendChild(frame);
    }
  }

  function setActiveTier(tier, countView = false) {
    if (tier < 1 || tier > TOTAL_TRIGGERS) return;
    currentTier = tier;
    if (countView) {
      const globalIdx = shuffledOrder[tier - 1];
      clickCounts[globalIdx] += 1;
      saveCounts();
      updateTotalDisplay();
    }
    document.querySelectorAll(".level-btn, .mobile-tier-btn").forEach(btn => {
      if (parseInt(btn.getAttribute("data-level"), 10) === tier) btn.classList.add("active");
      else btn.classList.remove("active");
    });
    renderCurrentTier();
  }

  function resetCounters() {
    clickCounts = new Array(TOTAL_POSTS).fill(0);
    saveCounts();
    updateTotalDisplay();
  }

  function buildTriggers() {
    const desktopContainer = document.getElementById("desktopTriggers");
    const mobileContainer = document.getElementById("mobileTriggers");
    desktopContainer.innerHTML = "";
    mobileContainer.innerHTML = "";
    for (let i = 1; i <= TOTAL_TRIGGERS; i++) {
      const dBtn = document.createElement("div");
      dBtn.className = "level-btn";
      dBtn.setAttribute("data-level", i);
      dBtn.innerHTML = `<i class="fas fa-tag"></i> ${i}`;
      dBtn.addEventListener("click", () => setActiveTier(i, true));
      desktopContainer.appendChild(dBtn);

      const mBtn = document.createElement("div");
      mBtn.className = "mobile-tier-btn";
      mBtn.setAttribute("data-level", i);
      mBtn.innerHTML = `<i class="fas fa-tag"></i> ${i}`;
      mBtn.addEventListener("click", () => setActiveTier(i, true));
      mobileContainer.appendChild(mBtn);
    }
  }

  // Clicking the headline on desktop or mobile smoothly centers the the single embedded post.
  const headlineButton = document.querySelector(".hero h1");
  function focusOffersFromHeadline() {
    document.getElementById("embedWindow").scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  }
  headlineButton.addEventListener("click", focusOffersFromHeadline);
  headlineButton.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      focusOffersFromHeadline();
    }
  });

  // Keep both floating controls in the browser top layer so ordinary page
  // overlays, transformed stacking contexts, and high z-index elements
  // cannot cover them. The CSS z-index remains a fallback.
  [document.getElementById("floatingResetBtn"), document.getElementById("floatingNavBtn")].forEach((button) => {
    if (button && typeof button.showPopover === "function") {
      try {
        button.showPopover();
      } catch (error) {
        console.warn("Could not move floating control to the top layer:", error);
      }
    }
  });

  // The left floating Trigger button always centers the trigger options.
  // It does not change the selected tier or any offer/click data.
  document.getElementById("floatingResetBtn").addEventListener("click", () => {
    const triggerArea = window.matchMedia("(max-width: 850px)").matches
      ? document.getElementById("mobileTierBar")
      : document.querySelector(".level-sidebar");

    triggerArea.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  });

  // The right floating Offer button always centers the the single embedded post.
  // It does not toggle to another action or change any offer/click data.
  document.getElementById("floatingNavBtn").addEventListener("click", () => {
    document.getElementById("embedWindow").scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  });

  document.getElementById("resetAllBtn").addEventListener("click", resetCounters);
  loadCounts();
  buildTriggers();
  setActiveTier(1);
  updateTotalDisplay();
</script>
</body>
</html>
