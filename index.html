<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>GlowPerks v2 | Exclusive Rewards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 80% 10%, #0a0c1a, #02040f);
      font-family: 'Inter', system-ui, sans-serif;
      padding: 2rem 1.5rem;
      min-height: 100vh;
    }

    .main-container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .content-area {
      flex: 3;
      min-width: 0;
      max-width: 100%;
    }

    .level-sidebar {
      flex: 0.9;
      min-width: 200px;
      position: sticky;
      top: 2rem;
      align-self: flex-start;
      background: rgba(15, 20, 35, 0.75);
      backdrop-filter: blur(16px);
      border-radius: 2rem;
      padding: 1.5rem 1rem;
      border: 1px solid rgba(251, 146, 60, 0.5);
      height: fit-content;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .level-sidebar h3 {
      color: #ffd6a5;
      font-size: 1.2rem;
      text-align: center;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .level-sidebar h3 i {
      color: #fb923c;
    }

    .triggers-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .level-btn {
      background: linear-gradient(105deg, #1a1e32, #11152a);
      border: 1px solid #fb923c;
      border-radius: 60px;
      padding: 8px 0;
      text-align: center;
      font-weight: 700;
      font-size: 0.75rem;
      color: #ffdead;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .level-btn i {
      font-size: 0.75rem;
      color: #fb923c;
    }

    .level-btn:hover {
      background: linear-gradient(105deg, #2a2f4a, #1a1f38);
      border-color: #f97316;
      transform: translateY(-2px);
    }

    .level-btn.active {
      background: linear-gradient(105deg, #ea580c, #c2410c);
      border-color: #fdba74;
      color: white;
    }

    .level-btn.active i {
      color: #fff0e0;
    }

    .hero {
      text-align: center;
      margin-bottom: 2rem;
    }

    .hero h1 {
      cursor: pointer;
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fb923c, #f97316, #fdba74);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      flex-wrap: nowrap;
      white-space: nowrap;
      justify-content: center;
    }

    .hero h1 i {
      background: none;
      -webkit-text-fill-color: #fb923c;
      font-size: 2rem;
    }

    @media (max-width: 550px) {
      .hero h1 {
        font-size: 1.4rem;
        gap: 8px;
      }
      .hero h1 i {
        font-size: 1.3rem;
      }
    }
    @media (max-width: 400px) {
      .hero h1 {
        font-size: 1.2rem;
        gap: 6px;
      }
      .hero h1 i {
        font-size: 1.1rem;
      }
    }

    .stats-card {
      background: rgba(10, 14, 30, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      padding: 1rem 1.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 2rem;
      margin-bottom: 0;
      border: 1px solid rgba(249, 115, 22, 0.4);
    }

    .total-box {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fcd9b6;
      font-weight: 600;
    }

    .total-box i {
      font-size: 2rem;
      color: #fb923c;
    }

    .total-number {
      background: #0a0e20;
      padding: 6px 20px;
      border-radius: 50px;
      font-size: 2rem;
      font-weight: 800;
      color: #fb923c;
      font-family: monospace;
      letter-spacing: 2px;
      border: 1px solid #f97316;
    }

    .legend {
      display: flex;

    }

    .legend span {

      gap: 6px;

    }

    .dot {

    }

    .dot.active {
      background: #10b981;
      box-shadow: 0 0 6px #34d399;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 1.5rem 0 1rem 0;
      padding-bottom: 6px;
      border-bottom: 2px solid rgba(249, 115, 22, 0.5);
    }

    .section-title i {

    }

    .section-title h2 {

    }

    .badge {
      background: #f97316;
      padding: 2px 12px;
      border-radius: 50px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #0a0a1a;
    }

    /* One responsive window displays the selected trigger's single Embed Post. */
    .embed-window {
      width: 100%;
      min-height: 120px;
      min-width: 0;
      max-width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 18px;
      background: rgba(10, 14, 30, 0.72);
      border: 1px solid rgba(249, 115, 22, 0.45);
      border-radius: 20px;
      overflow: visible;
    }
    .embed-content {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      min-width: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow: visible;
    }
    .embed-content > * {
      max-width: 100% !important;
    }
    /* Only direct-child iframes (URL fallback mode) are stretched.
       Pasted iframe codes keep their original width/height (see .embed-fit). */
    .embed-content > iframe {
      display: block;
      width: 100% !important;
      max-width: 100% !important;
      border: 0;
    }
    .embed-fit {
      position: relative;
      overflow: hidden;
      max-width: 100%;
      margin: 0 auto;
    }
    .embed-fit > iframe {
      display: block;
      border: 0;
      max-width: none !important;
      transform-origin: top left;
    }
    .embed-loading {
      color: #fdba74;
      text-align: center;
      padding: 28px 12px;
      font-size: 0.9rem;
    }
    .embed-error {
      color: #fecaca;
      text-align: center;
      padding: 28px 12px;
      line-height: 1.6;
    }
    .fb-post, .fb-post span, .fb-post iframe {
      max-width: 100% !important;
    }

    .offer-btn {
      background: linear-gradient(105deg, #13182e, #0c1022);
      border: 1px solid #3b3f66;
      border-radius: 60px;
      padding: 12px 12px;

      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-decoration: none;
      transition: all 0.25s ease;
      color: #e2e8f0;

      cursor: pointer;

    .offer-btn:hover {

      background: linear-gradient(105deg, #1c2340, #12172e);
      border-color: #fb923c;
      box-shadow: 0 8px 18px rgba(0,0,0,0.4);

    .offer-btn.disabled {
      opacity: 0.6;
      cursor: not-allowed;
      pointer-events: none;
      background: linear-gradient(105deg, #1a2a1a, #0f1f0f);
      border-color: #4a6a4a;
      transform: none;

    .btn-left {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }
    .btn-left i {
      font-size: 1.2rem;
      color: #fb923c;
      min-width: 28px;
      text-align: center;
    }
    .btn-left span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .click-count {
      background: #00000055;
      border-radius: 40px;
      padding: 3px 12px;
      font-size: 0.8rem;
      font-weight: 800;
      color: #fdba74;

    .reset-btn {
      background: rgba(249, 115, 22, 0.15);
      border: 1px solid #f97316;
      border-radius: 50px;
      padding: 6px 18px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #fdba74;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .reset-btn:hover {
      background: #f9731630;
      color: #ffffff;
      border-color: #fb923c;
    }

    footer {
      margin-top: 1.5rem;
      text-align: center;
      color: #6b7280;
      font-size: 0.75rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    @media (max-width: 850px) {
      .hero h1 { cursor: pointer; }
      .main-container { flex-direction: column; }
      .level-sidebar { display: none; }
      .mobile-tier-bar {
        display: block;
        background: rgba(15, 20, 35, 0.85);
        backdrop-filter: blur(16px);
        border-radius: 1.5rem;
        padding: 1rem;
        margin-bottom: 1.5rem;
        border: 1px solid rgba(251, 146, 60, 0.5);
      }
      .mobile-tier-bar h3 {
        color: #ffd6a5;
        font-size: 1rem;
        text-align: center;
        margin-bottom: 0.8rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;

      .mobile-triggers {
        display: grid;

      .mobile-tier-btn {
        background: linear-gradient(105deg, #1a1e32, #11152a);
        border: 1px solid #fb923c;
        border-radius: 60px;

    /* Fixed floating reset-to-top button */
    .floating-reset-btn {

      top: 16px;

      margin: 0;
      z-index: 2147483647;

      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 14px rgba(249, 115, 22, 0.28);

    .floating-reset-btn:hover {

    }
    .floating-reset-btn:active {

    /* Fixed floating navigation toggle */
    .floating-nav-btn {
      position: fixed;

      gap: 8px;

      padding: 0 16px;
      border: 1px solid rgba(253, 186, 116, 0.85);
      border-radius: 999px;

    @media (max-width: 550px) {

  </style>
</head>
<body>
<button type="button" popover="manual" class="floating-reset-btn" id="floatingResetBtn"
        aria-label="Show triggers" title="Trigger">
  <i class="fas fa-layer-group" aria-hidden="true"></i>

</button>

<button type="button" popover="manual" class="floating-nav-btn" id="floatingNavBtn"
        aria-label="Show offers" title="Offer">
  <i class="fas fa-gift" aria-hidden="true"></i>
  <span>Offer</span>
</button>

<div class="main-container">
  <div class="content-area">
    <div class="hero">
      <h1 role="button" tabindex="0" aria-label="Show offers in the center"><i class="fas fa-crown"></i> GLOWPERKS V2 <i class="fas fa-gem"></i></h1>
    </div>

    <div class="mobile-tier-bar" id="mobileTierBar">
      <h3><i class="fas fa-layer-group"></i> Choose Tier</h3>
      <div class="mobile-triggers" id="mobileTriggers"></div>
    </div>

    <div class="section-title" id="dynamicSectionTitle">
      <i class="fas fa-layer-group"></i>
      <h2 id="levelName">Tier 1 · Starter Pack</h2>
      <div class="badge" id="levelBadge">1 Embed Post</div>
    </div>
    <div id="embedWindow" class="embed-window">
      <div id="embedContent" class="embed-content">
        <div class="embed-loading">Select a trigger to view its Embed Post.</div>
      </div>
    </div>

    <div class="stats-card">
      <div class="total-box">
        <i class="fas fa-chart-line"></i>
        <span>Total Clicks</span>
        <div class="total-number" id="totalClicks">0</div>
      </div>
      <div class="legend">
        <span><i class="dot"></i> Pending</span>
        <span><i class="dot active"></i> Claimed</span>
      </div>

    <footer>
      <span><i class="far fa-clock"></i> 3 Embed Posts · 3 Triggers · One Post at a Time</span>
      <div class="reset-btn" id="resetAllBtn"><i class="fas fa-trash-alt"></i> Reset Counters</div>
    </footer>
  </div>

  <div class="level-sidebar">
    <h3><i class="fas fa-layer-group"></i> Choose Tier</h3>
    <div class="triggers-grid" id="desktopTriggers"></div>
  </div>
</div>

<script>
  // ==================== 3 LINKS ====================
  const ALL_LINKS = [
    "<iframe src=\"https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2Fpermalink.php%3Fstory_fbid%3Dpfbid0osgPkR61VxRnbj75rU5XkTKf4QoP1VwtdxfmCLsHm95s99i531zYyFmHGpX4RBj8l%26id%3D100094504426754&show_text=true&width=500\" width=\"500\" height=\"207\" style=\"border:none;overflow:hidden\" scrolling=\"no\" frameborder=\"0\" allowfullscreen=\"true\" allow=\"autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share\"></iframe>",
    "<iframe src=\"https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2Fpermalink.php%3Fstory_fbid%3Dpfbid02EaxEEzb7afUfZESEXYjFyh3tJPAjdiMTC2bJSx8M723NkWBJodc7Kzu5mwpoUjYul%26id%3D100094504426754&show_text=true&width=500\" width=\"500\" height=\"169\" style=\"border:none;overflow:hidden\" scrolling=\"no\" frameborder=\"0\" allowfullscreen=\"true\" allow=\"autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share\"></iframe>",
    "<iframe src=\"https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2Fpermalink.php%3Fstory_fbid%3Dpfbid0xMTD5o24786EVB5DELjgnTC171Anhq96cUhz3Q1cXKQmLeBr5z2NbcVLQ8imA6FMl%26id%3D100094504426754&show_text=true&width=500\" width=\"500\" height=\"207\" style=\"border:none;overflow:hidden\" scrolling=\"no\" frameborder=\"0\" allowfullscreen=\"true\" allow=\"autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share\"></iframe>"
];

  // Each trigger maps to exactly one input URL and therefore one Embed Post.
  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function lsGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function lsSet(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
  }

  function getShuffledIndices() {
    const ORDER_KEY = "vaultShuffledOrderV3";
    try {
      const saved = lsGet(ORDER_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length === 3 &&
            parsed.every(n => Number.isInteger(n) && n >= 0 && n < 3) &&
            new Set(parsed).size === 3) return parsed;
      }
    } catch (e) {}
    const indices = Array.from({ length: 3 }, (_, i) => i);
    shuffleArray(indices);
    lsSet(ORDER_KEY, JSON.stringify(indices));
    return indices;
  }

  const shuffledOrder = getShuffledIndices();

  const TOTAL_OFFERS = 3;
  let clickCounts = new Array(TOTAL_OFFERS).fill(0);
  let claimedStatus = new Array(TOTAL_OFFERS).fill(false);
  const STORAGE_KEY = "vaultClicksV3";
  const CLAIMED_KEY = "vaultClaimedV3";

  function loadCounts() {
    const saved = lsGet(STORAGE_KEY);
    if (saved) {
      try {
        let arr = JSON.parse(saved);
        if (arr.length === TOTAL_OFFERS) clickCounts = arr;
      } catch(e) {}
    }
    const savedClaimed = lsGet(CLAIMED_KEY);
    if (savedClaimed) {
      try {
        let arr = JSON.parse(savedClaimed);
        if (arr.length === TOTAL_OFFERS) claimedStatus = arr;
      } catch(e) {}
    }
  }
  function saveCounts() {
    lsSet(STORAGE_KEY, JSON.stringify(clickCounts));
    lsSet(CLAIMED_KEY, JSON.stringify(claimedStatus));
  }
  function updateTotalDisplay() {
    const total = clickCounts.reduce((a,b)=>a+b,0);
    document.getElementById("totalClicks").innerText = total;
  }

  let currentTier = 1;

  function getEmbedDetails(embedCodeOrUrl) {
    const value = String(embedCodeOrUrl || "").trim();
    if (/<iframe\b/i.test(value)) {
      const parsedDoc = new DOMParser().parseFromString(value, "text/html");
      const originalFrame = parsedDoc.querySelector("iframe");
      if (originalFrame) return { type: "iframe-code", element: originalFrame };
    }
    try {
      const parsed = new URL(value);
      const embeddedHref = parsed.searchParams.get("href");
      if (parsed.hostname.toLowerCase().includes("facebook.com") &&
          parsed.pathname.includes("/plugins/post.php") && embeddedHref) {
        return { type: "facebook", url: embeddedHref };
      }
      if (parsed.hostname.toLowerCase().includes("facebook.com") ||
          parsed.hostname.toLowerCase().includes("fb.watch")) {
        return { type: "facebook", url: value };
      }
      return { type: "iframe", url: value };
    } catch (error) {
      return { type: "iframe", url: value };
    }
  }

  function fitEmbed() {
    const frame = document.querySelector("#embedContent .embed-fit > iframe");
    if (!frame) return;
    const holder = frame.parentNode;
    const w = parseInt(frame.dataset.origW, 10) || 500;
    const h = parseInt(frame.dataset.origH, 10) || 650;
    const win = document.getElementById("embedWindow");
    const cs = getComputedStyle(win);
    const avail = win.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    if (!(avail > 0)) return;
    const scale = Math.min(1, avail / w);
    frame.style.width = w + "px";
    frame.style.height = h + "px";
    frame.style.transform = scale < 1 ? "scale(" + scale + ")" : "none";
    holder.style.width = Math.floor(w * scale) + "px";
    holder.style.height = Math.ceil(h * scale) + "px";
  }
  window.addEventListener("resize", fitEmbed);

  function renderCurrentTier() {
    const container = document.getElementById("embedContent");
    const globalIdx = shuffledOrder[currentTier - 1];
    const postUrl = ALL_LINKS[globalIdx];
    if (!postUrl) return;

    const tierNames = ["Starter Pack", "Bronze Tier", "Silver Tier", "Gold Tier", "Platinum Tier", "Emerald Tier", "Ruby Tier", "Sapphire Tier", "Diamond Tier", "Ultimate Vault"];
    document.getElementById("levelName").innerText = `Tier ${currentTier} · ${tierNames[currentTier-1] || "Tier " + currentTier}`;
    document.getElementById("levelBadge").innerText = "1 Embed Post";

    container.innerHTML = '<div class="embed-loading">Loading Embed Post…</div>';
    const embed = getEmbedDetails(postUrl);

    if (embed.type === "iframe-code") {
      // Insert the original iframe markup, keep its own width/height exactly,
      // and only scale it down (never stretch) if the window is narrower.
      container.innerHTML = String(postUrl).trim();
      const frame = container.querySelector("iframe");
      if (frame) {
        const origW = parseInt(frame.getAttribute("width"), 10) || 500;
        const origH = parseInt(frame.getAttribute("height"), 10) || 650;
        frame.dataset.origW = origW;
        frame.dataset.origH = origH;
        frame.removeAttribute("style");
        frame.style.border = "none";
        const holder = document.createElement("div");
        holder.className = "embed-fit";
        frame.parentNode.insertBefore(holder, frame);
        holder.appendChild(frame);
        fitEmbed();
        requestAnimationFrame(fitEmbed);
      }
    } else if (embed.type === "facebook") {
      const blockquote = document.createElement("blockquote");
      blockquote.className = "fb-post";
      blockquote.setAttribute("data-href", embed.url);
      blockquote.setAttribute("data-show-text", "true");
      blockquote.setAttribute("data-width", "");
      blockquote.style.width = "100%";
      blockquote.style.maxWidth = "100%";
      container.innerHTML = "";
      container.appendChild(blockquote);

      if (window.FB && window.FB.XFBML) {
        window.FB.XFBML.parse(container);
      } else {
        let sdk = document.getElementById("facebook-jssdk");
        if (!sdk) {
          sdk = document.createElement("script");
          sdk.id = "facebook-jssdk";
          sdk.src = "https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v20.0";
          sdk.async = true;
          sdk.onload = () => {
            if (window.FB && window.FB.XFBML) window.FB.XFBML.parse(container);
          };
          document.body.appendChild(sdk);
        } else if (window.FB && window.FB.XFBML) {
          window.FB.XFBML.parse(container);
        }
      }
    } else {
      const frame = document.createElement("iframe");
      frame.src = embed.url;
      frame.title = `Embedded Post ${currentTier}`;
      frame.loading = "eager";
      frame.scrolling = "auto";
      frame.referrerPolicy = "strict-origin-when-cross-origin";
      frame.allow = "autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share";
      frame.setAttribute("allowfullscreen", "true");
      frame.style.minHeight = "700px";
      frame.style.height = "min(1100px, 85vh)";
      frame.style.width = "100%";
      container.innerHTML = "";
      container.appendChild(frame);
    }

  }

  function setActiveTier(tier, countSelection = false) {
    currentTier = tier;
    const globalIdx = shuffledOrder[tier - 1];
    if (countSelection && globalIdx !== undefined && !claimedStatus[globalIdx]) {
      claimedStatus[globalIdx] = true;
      clickCounts[globalIdx] += 1;
      saveCounts();
      updateTotalDisplay();
    }
    document.querySelectorAll(".level-btn").forEach(btn => {
      if (parseInt(btn.getAttribute("data-level")) === tier) btn.classList.add("active");
      else btn.classList.remove("active");
    });
    document.querySelectorAll(".mobile-tier-btn").forEach(btn => {
      if (parseInt(btn.getAttribute("data-level")) === tier) btn.classList.add("active");
      else btn.classList.remove("active");
    });
    renderCurrentTier();
  }

  function resetCounters() {
    for (let i = 0; i < TOTAL_OFFERS; i++) {
      clickCounts[i] = 0;
      claimedStatus[i] = false;
    }
    saveCounts();
    updateTotalDisplay();
    renderCurrentTier();
  }

  function buildTriggers() {
    const desktopContainer = document.getElementById("desktopTriggers");
    const mobileContainer = document.getElementById("mobileTriggers");
    desktopContainer.innerHTML = "";
    mobileContainer.innerHTML = "";
    for (let i = 1; i <= 3; i++) {
      const dBtn = document.createElement("div");
      dBtn.className = "level-btn";
      dBtn.setAttribute("data-level", i);
      dBtn.innerHTML = `<i class="fas fa-tag"></i> ${i}`;
      dBtn.addEventListener("click", () => setActiveTier(i, true));
      desktopContainer.appendChild(dBtn);
      const mBtn = document.createElement("div");
      mBtn.className = "mobile-tier-btn";
      mBtn.setAttribute("data-level", i);
      mBtn.innerHTML = `<i class="fas fa-tag"></i> ${i}`;
      mBtn.addEventListener("click", () => setActiveTier(i, true));
      mobileContainer.appendChild(mBtn);
    }
  }

  // Clicking the headline on desktop or mobile smoothly centers the single Embed Post window.
  const headlineButton = document.querySelector(".hero h1");
  function focusOffersFromHeadline() {
    document.getElementById("embedWindow").scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  }
  headlineButton.addEventListener("click", focusOffersFromHeadline);
  headlineButton.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      focusOffersFromHeadline();
    }
  });

  // Keep both floating controls in the browser top layer so ordinary page
  // overlays, transformed stacking contexts, and high z-index elements
  // cannot cover them. The CSS z-index remains a fallback.
  [document.getElementById("floatingResetBtn"), document.getElementById("floatingNavBtn")].forEach((button) => {
    if (button && typeof button.showPopover === "function") {
      try {
        button.showPopover();
      } catch (error) {
        console.warn("Could not move floating control to the top layer:", error);
      }
    }
  });

  // The left floating Trigger button always centers the trigger options.
  // It does not change the selected tier or any offer/click data.
  document.getElementById("floatingResetBtn").addEventListener("click", () => {
    const triggerArea = window.matchMedia("(max-width: 850px)").matches
      ? document.getElementById("mobileTierBar")
      : document.querySelector(".level-sidebar");

    triggerArea.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  });

  // The right floating Offer button always centers the single Embed Post window.
  // It does not toggle to another action or change any offer/click data.
  document.getElementById("floatingNavBtn").addEventListener("click", () => {
    document.getElementById("embedWindow").scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  });

  document.getElementById("resetAllBtn").addEventListener("click", resetCounters);
  loadCounts();
  buildTriggers();
  setActiveTier(1);
  updateTotalDisplay();
</script>
</body>
</html>
